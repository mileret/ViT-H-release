# Training-set configuration. Dataset roots are supplied by an environment variable.

amass_00:
  _target_: hmr4d.dataset.pure_motion.g1_amass.G1AmassDualPthDataset
  amass_pth_path: "${oc.env:VITH_DATASET_ROOT,/path/to/training_set}/amass/part_00/motion.pth"
  g1_pth_path: "${oc.env:VITH_DATASET_ROOT,/path/to/training_set}/amass/part_00/g1.pth"
  g1_input_is_yup: true
  amass_fps: 30.0
  motion_frames: 120
  cam_augmentation: v11
  canonicalize_first_frame: true
  align_target: pelvis
  floor_adjust: true
  yaw_only_canon: true
  apply_az_to_ay_g1: true
  split: train
  split_seed: 42
  split_ratios: [0.9, 0.05, 0.05]
  ratio_lo: [0.7, 0.7, -.inf]
  ratio_hi: [1.05, 1.05, .inf]
  ratio_thr: 0.1
  skip_substrings: []

