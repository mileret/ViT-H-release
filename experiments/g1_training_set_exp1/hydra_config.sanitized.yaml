endecoder:
  _target_: hmr4d.model.offline.utils.endecoder.EnDecoder
  stats_name: MM_V1_AMASS_LOCAL_BEDLAM_CAM
  noise_pose_k: 10
exp_name_base: g1_training_set
exp_name_var: _exp1
pipeline:
  _target_: hmr4d.model.offline.pipeline.offline_pipeline.Pipeline
  args_denoiser3d: ${network}
  args:
    endecoder_opt: ${endecoder}
    normalize_cam_angvel: true
    n_joints: 29
    stats_file: data/g1_training_set_exp1_stats.npz
    pred_cam_stats_file: data/g1_training_set_exp1_pred_cam_stats.npz
    diffusion:
      noise_schedule: cosine
      schedule_sampler_type: uniform
      sigma_small: true
      sampler: ddim
      ddim_eta: 0.0
      train_timestep_respacing: ''
      test_timestep_respacing: '50'
      cfg_uncond_prob: 0.1
      guidance_param: 1.0
    weights:
      cr_j3d: 500.0
      cr_verts: 500.0
      transl_c: 1.0
      j2d: 1000.0
      verts2d: 1000.0
      transl_w: 1.0
      static_conf_bce: 1.0
      fk_vel_mse: 0.0
      fk_acc_mse: 0.0
      ee_vel_huber: 0.0
      ee_acc_huber: 0.0
      global_j3d: 0.0
      global_vertices3d: 0.0
      fk_j3d: 0.0
      fk_j3d_abs: 0.0
    robot:
      root_body_id: 0
      mjcf_file: unitree_description/mjcf/g1.xml
      sampled_vertices_path: hmr4d/utils/body_model/g1_sampled_vertices_384.pt
    static_conf:
      vel_thr: 0.15
      body_ids:
      - 14
      - 15
      - 18
      - 19
      - 28
      - 29
      vel_thr_mul:
      - 0.9
      - 0.9
      - 0.9
      - 0.9
      - 0.8
      - 0.8
    geometry_loss_type: huber
    geometry_huber_delta: 1.0
