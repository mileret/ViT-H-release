task: fit
exp_name: g1_training_set_exp1
data_name: g1_amass_bedlam_bedlam2_h36m_bones
output_dir: outputs/${data_name}/${exp_name}
ckpt_path: null
resume_mode: null
seed: 42
pl_trainer:
  devices: 8
  num_sanity_val_steps: 0
  precision: bf16-mixed
  inference_mode: false
  log_every_n_steps: 1
  gradient_clip_val: 0.5
  max_epochs: 10000
  check_val_every_n_epoch: 10
  strategy: ddp_find_unused_parameters_true
  use_distributed_sampler: false
  limit_val_batches: 0
logger:
  _target_: pytorch_lightning.loggers.WandbLogger
  project: offline
  name: ${exp_name}
  save_dir: ${output_dir}
  offline: false
  log_model: false
  job_type: train
  group: ${data_name}
  tags:
  - offline
  - g1
  - training_set
  - amass
  - bedlam
  - bedlam2
  - h36m
  - bones_seed
  - exp1
  - huber
  - lr2e4
  - l16
  - d1024
  - h16
  - bs32
  entity: ${WANDB_ENTITY}
data:
  _target_: hmr4d.datamodule.mocap_trainX_testY.DataModule
  dataset_opts:
    train: ${train_datasets}
  loader_opts:
    train:
      batch_size: 32
      num_workers: 1
      source_homogeneous_batches: false
      shuffle: true
      seed: ${seed}
      source_mixed_batches: true
    val:
      batch_size: 1
      num_workers: 0
  limit_each_trainset: null
model:
  _target_: hmr4d.model.offline.offline_pl.OfflinePL
  pipeline: ${pipeline}
  optimizer: ${optimizer}
  scheduler_cfg: ${scheduler_cfg}
  ignored_weights_prefix:
  - smplx
callbacks:
  simple_ckpt_saver:
    _target_: hmr4d.utils.callbacks.simple_ckpt_saver.SimpleCkptSaver
    output_dir: ${output_dir}/checkpoints/
    filename: e{epoch:03d}-s{step:06d}.ckpt
    save_top_k: 100
    every_n_epochs: 10
    save_last: null
    save_weights_only: true
  prog_bar:
    _target_: hmr4d.utils.callbacks.prog_bar.ProgressReporter
    log_every_percent: 0.02
    exp_name: ${exp_name}
    data_name: ${data_name}
  train_speed_timer:
    _target_: hmr4d.utils.callbacks.train_speed_timer.TrainSpeedTimer
    N_avg: 5
  lr_monitor:
    _target_: pytorch_lightning.callbacks.lr_monitor.LearningRateMonitor
network:
  _target_: hmr4d.network.offline.relative_transformer.NetworkEncoderRoPE
  output_dim: 189
  xt_dim: 189
  max_len: 120
  cliffcam_dim: 3
  cam_angvel_dim: 6
  imgseq_dim: 1024
  obs_num_joints: 14
  latent_dim: 1024
  num_layers: 16
  num_heads: 16
  mlp_ratio: 4.0
  pred_cam_dim: 3
  static_conf_dim: 6
  dropout: 0.1
  avgbeta: false
optimizer:
  _target_: torch.optim.adam.Adam
  _partial_: true
  lr: 0.0002
scheduler_cfg:
  scheduler: null
